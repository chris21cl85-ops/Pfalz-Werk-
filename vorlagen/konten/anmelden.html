{% extends "basis.html" %}
{% block titel %}Anmelden – PFALZ-WERK{% endblock %}
{% block inhalt %}
<div class="karte" style="max-width:480px;margin:40px auto;">
  <h1>Anmelden</h1>
  {% if form.errors %}<p class="fehler">Benutzername oder Passwort stimmt nicht.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label for="id_username">Benutzername</label>
    <input type="text" name="username" id="id_username" autofocus autocomplete="username" required>
    <label for="id_password">Passwort</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <p><button class="knopf" type="submit">Anmelden</button></p>
  </form>
</div>
{% endblock %}
